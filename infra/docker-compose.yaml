services:
  # Servicio 1: Cache y Almacenamiento clave-valor
  cache-services:
    image: redis:7-alpine
    container_name: compose-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vol_compose_redis:/data
    command: redis-server --appendonly yes
    networks:
      - red-infraestructura

  db-services:
    image: postgres:16-alpine
    container_name: compose-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=usuario_uleam
      - POSTGRES_PASSWORD=PasswordSeguro2026!
      - POSTGRES_DB=bd_integracion
    ports:
      - "5432:5432"
    volumes:
      - vol_compose_postgres:/var/lib/postgresql/data
    networks:
      - red-infraestructura

volumes:
  vol_compose_redis:
  vol_compose_postgres:

# Red privada virtual bridge para aislar tráfico entre los servicios
networks:
  red-infraestructura:
    driver: bridge